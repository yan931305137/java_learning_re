# 数据库连接配置
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/dbname?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
db.username=root
db.password=password

# HikariCP连接池配置
db.hikari.poolName=HikariCP
db.hikari.minimumIdle=5
db.hikari.maximumPoolSize=20
db.hikari.idleTimeout=60000
db.hikari.maxLifetime=1800000
db.hikari.leakDetectionThreshold=30000

# Apache DBCP2连接池配置
db.dbcp2.poolName=ApacheDBCP2
db.dbcp2.maxTotal=20
db.dbcp2.maxIdle=10
db.dbcp2.minIdle=5
db.dbcp2.maxWaitMillis=60000
db.dbcp2.removeAbandonedOnMaintenance=true
db.dbcp2.removeAbandonedTimeout=300

# Druid连接池配置
db.druid.poolName=DruidPool
db.druid.maxActive=20
db.druid.maxIdle=10
db.druid.minIdle=5
db.druid.maxWait=60000
db.druid.validationQuery=SELECT 1
db.druid.testWhileIdle=true
db.druid.testOnBorrow=true
db.druid.testOnReturn=true